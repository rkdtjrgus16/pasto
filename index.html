<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맛있는 집 — 파스타</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header header--sub">
    <a class="header__back header__back--ghost" href="manage.html">직접 메뉴 만들기 →</a>
    <div class="header__inner">
      <p class="header__eyebrow">Pasta House</p>
      <h1 class="header__title">맛있는 집</h1>
      <p class="header__tagline">아래 파스타 사진을 누르면 상세 페이지로 이동합니다.</p>
    </div>
  </header>

  <main>
    <section class="section home-intro" aria-labelledby="home-intro-heading">
      <h2 id="home-intro-heading" class="section__title">메뉴 고르기</h2>
      <p class="intro__text">
        카드를 클릭하면 그 메뉴만의 설명·리뷰를 볼 수 있는 <strong>별도 페이지</strong>로 들어갑니다.
      </p>
    </section>

    <ul class="home-pasta-grid" id="pasta-grid" aria-label="파스타 메뉴 목록"></ul>
  </main>

  <footer class="footer">
    <p>맛있는 집 — 연습용 데모 · <a href="manage.html">내 사진으로 메뉴 등록</a></p>
  </footer>

  <script src="pastas.js"></script>
  <script src="home.js"></script>
</body>
</html>
